name: V4 interaction polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v4-interaction-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V4 interaction polish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('app/VictorianBoardV4.tsx')
          s=p.read_text()

          # Add smooth-loop helper and resource art helper after normalise.
          marker='function normalise(s:string){return s.toLowerCase().normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").replace(/[^a-z0-9]/g,"")}\n'
          helper='''function normalise(s:string){return s.toLowerCase().normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").replace(/[^a-z0-9]/g,"")}\nfunction smoothLoopPath(){\n const pts=victorianSites.slice(0,16);\n const mids=pts.map((p,i)=>{const n=pts[(i+1)%pts.length];return{x:(p.x+n.x)/2,y:(p.y+n.y)/2}});\n let d=`M ${mids[15].x} ${mids[15].y}`;\n pts.forEach((p,i)=>{const m=mids[i];d+=` Q ${p.x} ${p.y} ${m.x} ${m.y}`});\n return d+" Z";\n}\nfunction resourceArtFor(kind:string){if(kind==="coal")return "coal";if(kind==="iron")return "iron";if(kind==="university")return "knowledge";if(kind==="port")return "capital";return null}\n'''
          if 'function smoothLoopPath' not in s:
              if marker not in s: raise SystemExit('normalise marker not found')
              s=s.replace(marker,helper)

          # Replace line-segment track with smooth loop + finish spur.
          old='<svg className={styles.track} viewBox="0 0 100 100" preserveAspectRatio="none">{victorianSites.flatMap(s=>s.links.filter(id=>id>s.id).map(id=>{const o=victorianSites[id];return <g key={`${s.id}-${id}`}><line className={styles.trackShadow} x1={s.x} y1={s.y} x2={o.x} y2={o.y}/><line className={styles.rail} x1={s.x} y1={s.y} x2={o.x} y2={o.y}/><line className={styles.sleepers} x1={s.x} y1={s.y} x2={o.x} y2={o.y}/></g>}))}</svg>'
          new='<svg className={styles.track} viewBox="0 0 100 100" preserveAspectRatio="none"><path className={styles.trackShadow} d={smoothLoopPath()}/><path className={styles.rail} d={smoothLoopPath()}/><path className={styles.sleepers} d={smoothLoopPath()}/><path className={styles.trackShadow} d="M 82 55 Q 87 54 92 55"/><path className={styles.rail} d="M 82 55 Q 87 54 92 55"/><path className={styles.sleepers} d="M 82 55 Q 87 54 92 55"/></svg>'
          if old not in s and new not in s: raise SystemExit('track block not found')
          s=s.replace(old,new)

          # Resource-specific minor spaces.
          old='{victorianSites.map(s=>{const crop=s.major?stationCrops[s.shortName]:undefined;return <button key={s.id} className={`${styles.station} ${crop?styles.major:""} ${s.kind==="event"?styles.event:""} ${targets.includes(s.id)?styles.target:""}`} style={{left:`${s.x}%`,top:`${s.y}%`}} disabled={!targets.includes(s.id)} onClick={()=>moveTo(s.id)}>{crop?<Sprite src={STATION} crop={crop} width={s.kind==="exhibition"?86:70}/>:<span className={styles.roundel}><Glyph kind={s.kind}/></span>}</button>})}'
          new='{victorianSites.map(s=>{const crop=s.major?stationCrops[s.shortName]:undefined;const art=resourceArtFor(s.kind);return <button key={s.id} className={`${styles.station} ${crop?styles.major:""} ${s.kind==="event"?styles.event:""} ${targets.includes(s.id)?styles.target:""}`} style={{left:`${s.x}%`,top:`${s.y}%`}} disabled={!targets.includes(s.id)} onClick={()=>moveTo(s.id)}>{crop?<Sprite src={STATION} crop={crop} width={s.kind==="exhibition"?86:70}/>:art?<span className={`${styles.roundel} ${styles.resourceRoundel}`}><Sprite src={RESOURCE} crop={resourceCrops[art]} width={28}/></span>:<span className={styles.roundel}><Glyph kind={s.kind}/></span>}</button>})}'
          if old not in s and new not in s: raise SystemExit('station block not found')
          s=s.replace(old,new)

          # Mini engine progressive colour fill.
          old='function EngineCard({player,active=false}:{player:Player;active?:boolean}){return <div className={`${styles.engineCard} ${active?styles.engineCardActive:""}`}><div className={styles.engineInfo}><small>{active?"YOUR TURN":"WAITING"}</small><b>{player.name}</b><span>{player.components.length}/6 BUILT</span></div><Sprite src={LOCO} crop={finished} width={112} className={player.components.length===6?styles.miniComplete:styles.miniGhost}/><div className={styles.pips}>{componentOrder.map(k=><i key={k} className={player.components.includes(k)?styles.pipBuilt:""}/>)}</div></div>}'
          new='function EngineCard({player,active=false}:{player:Player;active?:boolean}){const pct=(player.components.length/6)*100;return <div className={`${styles.engineCard} ${active?styles.engineCardActive:""}`}><div className={styles.engineInfo}><small>{active?"YOUR TURN":"WAITING"}</small><b>{player.name}</b><span>{player.components.length}/6 BUILT</span></div><div className={styles.miniProgress}><Sprite src={LOCO} crop={finished} width={112} className={styles.miniGhost}/><div className={styles.miniColour} style={{width:`${pct}%`}}><Sprite src={LOCO} crop={finished} width={112} className={styles.miniComplete}/></div></div><div className={styles.pips}>{componentOrder.map(k=><i key={k} className={player.components.includes(k)?styles.pipBuilt:""}/>)}</div></div>}'
          if old not in s and new not in s: raise SystemExit('engine card block not found')
          s=s.replace(old,new)

          # Keep bottom compact; engineering becomes overlay.
          old='<section className={styles.bottom}><Resources player={player}/><section className={styles.workshop}><div className={styles.workshopTitle}><span>LOCOMOTIVE WORKS</span><b>{player.components.length}/6 BUILT</b></div>{engineeringView||atWorks?<Engineering player={player} canBuild={canBuild} onBuild={beginBuild}/>:<BuildStrip player={player}/>}</section><aside className={styles.objective}><small>CURRENT OBJECTIVE</small><p>{message}</p>{roll!==null&&!challenge&&!winner&&<button onClick={pass}>PASS TO {other.name.toUpperCase()}</button>}</aside></section>'
          new='<section className={styles.bottom}><Resources player={player}/><section className={styles.workshop}><div className={styles.workshopTitle}><span>LOCOMOTIVE WORKS</span><b>{player.components.length}/6 BUILT</b></div><BuildStrip player={player}/></section><aside className={styles.objective}><small>CURRENT OBJECTIVE</small><p>{message}</p>{roll!==null&&!challenge&&!winner&&<button onClick={pass}>PASS TO {other.name.toUpperCase()}</button>}</aside></section>{engineeringView&&atWorks&&!challenge&&<div className={styles.engineeringOverlay}><div className={styles.engineeringPanel}><button className={styles.closeEngineering} onClick={()=>setEngineeringView(false)}>RETURN TO BOARD</button><div className={styles.engineeringHeading}><small>ENGINEERING WORKS</small><h2>Build your locomotive</h2><p>Choose a component you can afford. The locomotive expands here only while construction is underway.</p></div><Engineering player={player} canBuild={canBuild} onBuild={beginBuild}/></div></div>}'
          if old not in s and new not in s: raise SystemExit('bottom block not found')
          s=s.replace(old,new)
          p.write_text(s)

          c=Path('app/VictorianBoardV4.module.css')
          css=c.read_text()
          css += r'''

/* Interaction polish: compact board + engineering overlay */
.page{grid-template-rows:54px minmax(0,1fr) 174px}.header{grid-template-columns:235px minmax(400px,1fr) 280px;padding:2px 10px}.title h1{font-size:clamp(21px,2vw,28px)}.engineCard{height:44px;grid-template-columns:minmax(78px,1fr) 112px;grid-template-rows:1fr 4px}.miniProgress{position:relative;width:112px;height:27px;overflow:hidden}.miniProgress>.sprite{position:absolute;left:0;top:0}.miniColour{position:absolute;left:0;top:0;height:100%;overflow:hidden;transition:width .35s ease}.miniColour>.sprite{position:absolute;left:0;top:0}.board{margin-top:3px;border-width:4px}.trackShadow,.rail,.sleepers{fill:none}.trackShadow{stroke-width:6}.rail{stroke-width:3}.sleepers{stroke-width:1.35;stroke-dasharray:.65 1.9}.roundel{width:27px;height:27px;border-width:2px}.resourceRoundel{overflow:hidden;background:#0a231b}.resourceRoundel .sprite{transform:scale(.76);transform-origin:center}.major .sprite{transform:scale(.9);transform-origin:center}.pawn{width:25px;height:25px;font-size:9px}.bottom{grid-template-columns:145px minmax(0,1fr) 135px;gap:5px;padding:4px 7px 7px}.resources,.objective{padding:4px}.resource{grid-template-columns:30px 1fr auto;padding:2px 0}.resource span{font-size:8px}.resource b{font-size:14px}.workshopTitle{padding:3px 8px}.workshopTitle span{font-size:10px}.workshopTitle b{font-size:8px}.buildStrip{height:137px;grid-template-rows:68px 69px}.miniBay{padding:2px 10px;gap:12px}.miniBay p{font-size:7px;max-width:210px}.parts{padding:2px;gap:2px}.part{padding:1px}.part b{font-size:6px}.part span{font-size:4px}.objective p{font-size:7px}.objective button{padding:6px 4px;font-size:8px}.engineeringOverlay{position:fixed;z-index:92;inset:54px 0 0;display:grid;place-items:center;padding:26px;background:rgba(4,7,5,.72);backdrop-filter:blur(5px)}.engineeringPanel{position:relative;width:min(930px,92vw);padding:18px 20px 16px;border:5px double #a87731;border-radius:16px;background:linear-gradient(180deg,#e8d7aa,#c4a673);box-shadow:0 34px 90px #000c;color:#382514}.engineeringHeading{text-align:center;margin-bottom:8px}.engineeringHeading small{font-size:9px;letter-spacing:.18em;color:#80551f}.engineeringHeading h2{margin:2px 0;font-size:27px}.engineeringHeading p{margin:0 auto;max-width:560px;font:10px/1.4 system-ui;color:#5a4327}.engineeringPanel .engineering{height:300px;grid-template-rows:215px 85px;border:2px solid #8d642e;border-radius:9px;overflow:hidden;box-shadow:inset 0 0 0 1px #fff6}.engineeringPanel .bigEngine .sprite{transform:scale(1.16);transform-origin:center}.engineeringPanel .parts{padding:5px;gap:5px}.engineeringPanel .part{padding:4px}.engineeringPanel .part b{font-size:9px}.engineeringPanel .part span{font-size:6px}.closeEngineering{position:absolute;right:14px;top:12px;padding:7px 10px;border:1px solid #8a612c;border-radius:6px;background:#0c3024;color:#efd08b;font-family:inherit;font-size:8px;letter-spacing:.08em}
'''
          c.write_text(css)

          # Smaller resting die, preserving animation readability.
          d=Path('app/Dice3D.tsx')
          ds=d.read_text().replace('scale={[0.82, 0.82, 0.82]}','scale={[0.66, 0.66, 0.66]}')
          d.write_text(ds)
          PY
          git rm .github/workflows/v4-interaction-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/VictorianBoardV4.tsx app/VictorianBoardV4.module.css app/Dice3D.tsx
          git commit -m 'Polish V4 board interaction and engineering view'
          git push origin HEAD:main
