name: Activate Victorian V3 production styles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-v3-production-styles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch V3 to merged style map
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('app/VictorianBoardV3.tsx')
          s = p.read_text()
          old = 'import styles from "./VictorianBoardV3.module.css";'
          new = 'import styles from "./VictorianBoardV3Styles";'
          if old not in s and new not in s:
              raise SystemExit('Expected V3 style import not found')
          p.write_text(s.replace(old, new))
          PY
          git rm .github/workflows/activate-v3-production-styles.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/VictorianBoardV3.tsx
          git commit -m 'Activate Victorian V3 production art styles'
          git push origin HEAD:main
