name: Import Aster Vale board art

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-aster-vale-board.yml'

permissions:
  contents: write

jobs:
  import-board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download approved Aster Vale board
        run: |
          mkdir -p public/assets/aster-vale
          curl -L --fail --retry 3 'https://at.adobe.com/f9YP9f5flemveLJi' -o public/assets/aster-vale/board.png
          test -s public/assets/aster-vale/board.png
          file public/assets/aster-vale/board.png
      - name: Commit board asset and remove importer
        run: |
          rm .github/workflows/import-aster-vale-board.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/aster-vale/board.png .github/workflows/import-aster-vale-board.yml
          git commit -m 'Add approved Aster Vale board art'
          git push
