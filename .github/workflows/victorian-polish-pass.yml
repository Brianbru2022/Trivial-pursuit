name: Victorian polish pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/victorian-polish-pass.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply controlled V3 polish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('app/VictorianBoardV3.tsx')
          s = p.read_text()

          old = 'const finishedLocoCrop:Crop={x:180,y:630,w:1330,h:311,sourceW:1672,sourceH:941};'
          new = old + '\nconst sepiaLocoCrop:Crop={x:205,y:405,w:1240,h:270,sourceW:1672,sourceH:941};'
          if old in s and 'sepiaLocoCrop' not in s:
              s = s.replace(old,new)

          s = s.replace('width={s.kind==="exhibition"?112:106}', 'width={s.kind==="exhibition"?104:90}')

          old_loco = '<div className={styles.loco}>{ready?<div className={styles.finishedLoco}><SpriteCrop src={LOCO_SHEET} crop={finishedLocoCrop} width={670}/><span>READY FOR THE GREAT EXHIBITION</span></div>:<VictorianLocomotiveV3 completed={player.components}/>}</div>'
          new_loco = '<div className={styles.loco}>{ready?<div className={styles.finishedLoco}><SpriteCrop src={LOCO_SHEET} crop={finishedLocoCrop} width={670}/><span>READY FOR THE GREAT EXHIBITION</span></div>:<ProgressiveLocomotive completed={player.components}/>}</div>'
          if old_loco not in s and new_loco not in s:
              raise SystemExit('Could not find locomotive render block')
          s = s.replace(old_loco,new_loco)

          marker = 'function Resource({art,label,value}:{art:string;label:string;value:number})'
          helper = '''function ProgressiveLocomotive({completed}:{completed:ComponentKey[]}){\n const overlayWidths:Record<ComponentKey,number>={boiler:265,wheels:190,pistons:160,firebox:120,cab:125,tender:175};\n const overlayClass:Record<ComponentKey,string>={boiler:styles.boilerOverlay,wheels:styles.wheelsOverlay,pistons:styles.pistonsOverlay,firebox:styles.fireboxOverlay,cab:styles.cabOverlay,tender:styles.tenderOverlay};\n return <div className={styles.progressLoco}>\n   <SpriteCrop src={LOCO_SHEET} crop={sepiaLocoCrop} width={690} className={styles.progressLocoBase}/>\n   {componentOrder.filter(k=>completed.includes(k)).map(k=><SpriteCrop key={k} src={LOCO_SHEET} crop={componentCrops[k]} width={overlayWidths[k]} className={`${styles.progressOverlay} ${overlayClass[k]}`}/>)}\n </div>;\n}\n'''
          if 'function ProgressiveLocomotive' not in s:
              if marker not in s:
                  raise SystemExit('Resource marker not found')
              s = s.replace(marker, helper + marker)
          p.write_text(s)

          d = Path('app/Dice3D.tsx')
          ds = d.read_text()
          needle = 'rotation={[0.25, 0.45, -0.2]}\n      onClick='
          replacement = 'rotation={[0.25, 0.45, -0.2]}\n      scale={[0.82, 0.82, 0.82]}\n      onClick='
          if needle not in ds and 'scale={[0.82, 0.82, 0.82]}' not in ds:
              raise SystemExit('Dice group marker not found')
          ds = ds.replace(needle,replacement)
          d.write_text(ds)
          PY
          git rm .github/workflows/victorian-polish-pass.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/VictorianBoardV3.tsx app/Dice3D.tsx
          git commit -m 'Polish Victorian board composition and locomotive progress'
          git push origin HEAD:main
